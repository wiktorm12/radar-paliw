title: 'Block: Promotions List'
fields:
  -
    handle: section_header
    field:
      type: section
      display: Nagłówek
  -
    import: partial_header
  -
    handle: section_content
    field:
      type: section
      display: Zapytanie
      instructions: 'Które promocje pokazać. Wygasłe promocje są pomijane automatycznie.'
  -
    handle: stations
    field:
      type: entries
      display: Stacje
      instructions: 'Puste = wszystkie stacje.'
      collections:
        - stations
      mode: select
  -
    handle: fuel_type
    field:
      type: terms
      display: 'Rodzaj paliwa'
      instructions: 'Puste = wszystkie paliwa.'
      taxonomies:
        - paliwa
      max_items: 1
      mode: select
  -
    handle: limit
    field:
      type: integer
      display: Limit
      default: 12
  -
    handle: section_settings
    field:
      type: section
      display: Ustawienia
      instructions: 'Wygląd i układ bloku.'
  -
    handle: ad_every
    field:
      type: integer
      display: 'Reklama co X promocji'
      instructions: '0 = bez reklam in-feed (miejsce: Lista promocji — między kartami).'
      default: 6
      width: 33
  -
    import: partial_background
  -
    import: partial_section_id

title: 'Master: Builder'
fields:
  -
    handle: content
    field:
      type: replicator
      display: Treść
      collapse: true
      button_label: 'Dodaj blok'
      sets:
        new_set_group:
          display: Bloki
          sets:
            block_hero:
              display: Hero
              icon: layout-header
              fields:
                -
                  import: block_hero
            block_text:
              display: Tekst
              icon: paragraph-left-align
              fields:
                -
                  import: block_text
            block_promotions_list:
              display: 'Lista promocji'
              icon: list-bullets
              fields:
                -
                  import: block_promotions_list
            block_ad:
              display: Reklama
              icon: money-cash-bill
              fields:
                -
                  import: block_ad
            block_articles_list:
              display: 'Lista artykułów'
              icon: content-writing
              fields:
                -
                  import: block_articles_list
            block_stations_grid:
              display: 'Siatka stacji'
              icon: grid
              fields:
                -
                  import: block_stations_grid
            block_faq:
              display: FAQ
              icon: help
              fields:
                -
                  import: block_faq

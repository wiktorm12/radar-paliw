title: Ustawienia
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: logo
            field:
              type: assets
              display: Logo
              container: img
              max_files: 1
          -
            handle: footer_text
            field:
              type: textarea
              display: 'Tekst w stopce'
          -
            handle: og_image
            field:
              type: assets
              display: 'Domyślny obraz OG (1200×630)'
              container: img
              max_files: 1
          -
            handle: seo_description
            field:
              type: textarea
              display: 'Domyślny meta description'
              character_limit: 170
          -
            handle: same_as
            field:
              type: list
              display: 'Profile społecznościowe (sameAs)'
              instructions: 'Pełne URL-e profili (Facebook, Instagram, LinkedIn…) — trafiają do schema Organization.'
          -
            handle: legal_name
            field:
              type: text
              display: 'Pełna nazwa wydawcy (legalName)'
              instructions: 'Nazwa firmy z rejestru — trafia do schema Organization. Puste = pominięte.'
          -
            handle: contact_email
            field:
              type: text
              input_type: email
              display: 'E-mail kontaktowy'
              instructions: 'Trafia do schema Organization (email, contactPoint).'
          -
            handle: publishing_principles_url
            field:
              type: text
              display: 'Zasady redakcyjne — URL'
              instructions: 'Ścieżka strony z zasadami redakcyjnymi (schema publishingPrinciples), np. /zasady-redakcyjne.'
  integrations:
    display: Integracje
    sections:
      -
        fields:
          -
            handle: google_site_verification
            field:
              type: text
              display: 'Google Search Console — kod weryfikacji'
              instructions: 'Sama wartość `content` z meta tagu `google-site-verification` (metoda „Tag HTML”). Zbędne, jeśli domenę zweryfikowano przez DNS.'
          -
            handle: cloudflare_analytics_token
            field:
              type: text
              display: 'Cloudflare Web Analytics — token'
              instructions: 'Token z fragmentu JS (`data-cf-beacon`). Skrypt ładuje się tylko na produkcji, bez cookies.'

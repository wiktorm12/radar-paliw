title: Strona
tabs:
  main:
    display: Treść
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Tytuł
              required: true
              validate:
                - required
          -
            import: master_builder
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: partial_seo
          -
            handle: schema_type
            field:
              type: select
              display: 'Typ strony (schema.org)'
              default: WebPage
              options:
                -
                  key: WebPage
                  value: 'WebPage — zwykła strona'
                -
                  key: CollectionPage
                  value: 'CollectionPage — lista / archiwum'
                -
                  key: AboutPage
                  value: 'AboutPage — o nas'
                -
                  key: ContactPage
                  value: 'ContactPage — kontakt'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              display: Rodzic
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true

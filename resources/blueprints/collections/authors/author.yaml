title: Autor
tabs:
  main:
    display: Treść
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: 'Imię i nazwisko'
              required: true
              validate:
                - required
          -
            handle: job_title
            field:
              type: text
              display: Stanowisko
              instructions: 'Np. „Redaktor, specjalista od programów lojalnościowych”.'
              width: 50
          -
            handle: photo
            field:
              type: assets
              display: Zdjęcie
              container: img
              max_files: 1
              width: 50
          -
            handle: email
            field:
              type: text
              input_type: email
              display: 'E-mail'
              instructions: 'Adres kontaktowy autora — pokazywany na stronie autora i w schema Person.'
          -
            handle: bio
            field:
              type: textarea
              display: Bio
              instructions: 'Kilka zdań o doświadczeniu — wzmacnia wiarygodność (E-E-A-T).'
          -
            handle: same_as
            field:
              type: list
              display: 'Profile (LinkedIn, X…)'
              instructions: 'Pełne URL-e — trafiają do schema Person.'
          -
            handle: knows_about
            field:
              type: list
              display: 'Specjalizacje (knowsAbout)'
              instructions: 'Tematy, na których autor się zna, np. „programy lojalnościowe stacji paliw”.'
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: partial_seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              validate: 'max:200'

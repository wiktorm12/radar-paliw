title: Kategoria
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Nazwa
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: bard
              display: Opis
              instructions: 'Wstęp nad listą artykułów kategorii.'
              allow_source: true
              remove_empty_nodes: false
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - anchor
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: partial_seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              validate: 'max:200'

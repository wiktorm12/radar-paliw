<header class="border-b border-zinc-200 bg-white">
    <div class="container flex items-center justify-between gap-6 py-2">
        <a
            href="/"
            class="shrink-0 py-1"
        >
            <img
                src="/img/logo/radar-paliw-logo.svg"
                alt="{{ site:name }}"
                width="144"
                height="36"
                class="h-9 w-36"
            >
        </a>
        {{ nav:main as="links" }}
            {{ if links }}
                <nav
                    aria-label="Menu główne"
                    class="relative"
                >
                    <details
                        class="site-nav"
                        data-header-nav
                    >
                        <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 rounded-lg px-3 text-sm font-semibold marker:hidden md:hidden [&::-webkit-details-marker]:hidden">
                            Menu
                            <svg
                                class="size-4"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                aria-hidden="true"
                            >
                                <path d="M4 7h16M4 12h16M4 17h16"/>
                            </svg>
                        </summary>
                        <ul class="absolute right-0 top-full z-30 flex w-56 flex-col rounded-lg border border-zinc-200 bg-white p-2 text-sm font-medium shadow-lg md:static md:w-auto md:flex-row md:gap-2 md:border-0 md:p-0 md:shadow-none">
                            {{ links }}
                                <li>
                                    <a
                                        href="{{ url }}"
                                        class="inline-flex min-h-11 items-center rounded-lg px-3 {{ is_current || is_parent ? 'font-semibold text-brand-700 underline underline-offset-4' : 'hover:text-brand-700 hover:underline' }}"
                                        {{ is_current ?= 'aria-current="page"' }}
                                    >
                                        {{ title }}
                                    </a>
                                </li>
                            {{ /links }}
                        </ul>
                    </details>
                </nav>
            {{ /if }}
        {{ /nav:main }}
    </div>
</header>

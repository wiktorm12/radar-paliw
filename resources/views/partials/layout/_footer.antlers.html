<footer class="bg-zinc-900 text-zinc-400">
    <div class="container flex flex-col gap-6 py-10 md:flex-row md:justify-between">
        <p class="max-w-xl text-sm">{{ settings:footer_text }}</p>
        <ul class="flex flex-wrap gap-4 text-sm">
            {{ nav:footer }}
                <li>
                    <a
                        href="{{ url }}"
                        class="hover:text-white"
                    >
                        {{ title }}
                    </a>
                </li>
            {{ /nav:footer }}
        </ul>
    </div>
</footer>

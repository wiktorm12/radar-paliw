---
bg:
    'white': 'bg-white'
    'gray': 'bg-zinc-100'
    'dark': 'bg-zinc-900 text-white'
---

{{ partial:section class="{{ view:bg[background_color] }}" }}
    <div class="container">
        <div class="max-w-3xl">
            {{ if heading }}
                <h1 class="mb-6 text-4xl font-bold tracking-tight text-balance md:text-5xl">{{ heading }}</h1>
            {{ /if }}
            {{ if intro }}
                <p class="text-lg text-zinc-600 md:text-xl">{{ intro }}</p>
            {{ /if }}
        </div>
    </div>
{{ /partial:section }}

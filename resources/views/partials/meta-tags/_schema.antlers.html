<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "Organization",
            "@id": "{{ site:permalink }}/#organization",
            "name": {{ site:name | to_json }},
            "url": "{{ site:permalink }}/"{{ settings:logo }},
            "logo": {
                "@type": "ImageObject",
                "url": "{{ permalink }}"
            }{{ /settings:logo }}{{ if settings:same_as }},
            "sameAs": {{ settings:same_as | to_json }}{{ /if }}
        },
        {
            "@type": "WebSite",
            "@id": "{{ site:permalink }}/#website",
            "name": {{ site:name | to_json }},
            "url": "{{ site:permalink }}/",
            "inLanguage": "pl-PL",
            "publisher": { "@id": "{{ site:permalink }}/#organization" }
        },
        {
            "@type": "{{ yield:schema_page_type }}{{ schema_type:value ?? 'WebPage' }}{{ /yield:schema_page_type }}",
            "@id": "{{ current_url }}#webpage",
            "url": "{{ current_url }}",
            "name": {{ (seo_title ?? title) | strip_tags | to_json }},
            "description": {{ (seo_description ?? excerpt ?? settings:seo_description) | strip_tags | to_json }},
            "inLanguage": "pl-PL",
            "isPartOf": { "@id": "{{ site:permalink }}/#website" }{{ if last_modified }},
            "dateModified": "{{ last_modified format='c' }}"{{ /if }}{{ unless is_homepage }},
            "breadcrumb": { "@id": "{{ current_url }}#breadcrumb" }{{ /unless }}{{ featured_image }},
            "primaryImageOfPage": {
                "@type": "ImageObject",
                "url": "{{ glide :src="id" width="1200" height="630" fit="crop_focal" absolute="true" }}"
            }{{ /featured_image }}{{ yield:schema_main_entity }}
        }{{ stack:schema }}
    ]
}
</script>

<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "Organization",
            "@id": "{{ site:permalink }}/#organization",
            "name": {{ site:name | to_json }},{{ if settings:legal_name }}
            "legalName": {{ settings:legal_name | to_json }},{{ /if }}
            "url": "{{ site:permalink }}/",
            "logo": {
                "@type": "ImageObject",
                "@id": "{{ site:permalink }}/#logo",
                "url": "{{ site:permalink }}/img/logo/icon-512.png",
                "contentUrl": "{{ site:permalink }}/img/logo/icon-512.png",
                "width": 512,
                "height": 512,
                "caption": {{ site:name | to_json }}
            },
            "image": { "@id": "{{ site:permalink }}/#logo" }{{ if settings:contact_email }},
            "email": {{ settings:contact_email | to_json }},
            "contactPoint": {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "email": {{ settings:contact_email | to_json }},
                "availableLanguage": "pl-PL"
            }{{ /if }}{{ if settings:publishing_principles_url }},
            "publishingPrinciples": "{{ site:permalink }}{{ settings:publishing_principles_url }}"{{ /if }}{{ if settings:same_as }},
            "sameAs": {{ settings:same_as | to_json }}{{ /if }}
        },
        {
            "@type": "WebSite",
            "@id": "{{ site:permalink }}/#website",
            "name": {{ site:name | to_json }},
            "url": "{{ site:permalink }}/",
            "inLanguage": "pl-PL",
            "publisher": { "@id": "{{ site:permalink }}/#organization" }
        },
        {
            "@type": "{{ yield:schema_page_type }}{{ schema_type:value ?? 'WebPage' }}{{ /yield:schema_page_type }}",
            "@id": "{{ meta_canonical }}#webpage",
            "url": "{{ meta_canonical }}",
            "name": {{ (meta_og_title ?? site:name) | to_json }},{{ if meta_description }}
            "description": {{ meta_description | to_json }},{{ /if }}
            "inLanguage": "pl-PL",
            "isPartOf": { "@id": "{{ site:permalink }}/#website" },
            "publisher": { "@id": "{{ site:permalink }}/#organization" }{{ if meta_published }},
            "datePublished": "{{ meta_published }}"{{ /if }}{{ if meta_modified }},
            "dateModified": "{{ meta_modified }}"{{ /if }}{{ unless is_homepage }},
            "breadcrumb": { "@id": "{{ current_url }}#breadcrumb" }{{ /unless }}{{ featured_image }},
            "primaryImageOfPage": {
                "@type": "ImageObject",
                "url": "{{ glide :src="id" width="1200" height="630" fit="crop_focal" absolute="true" }}"
            }{{ /featured_image }}{{ yield:schema_main_entity }}{{ if meta_has_itemlist }},
            "mainEntity": { "@id": "{{ current_url }}#itemlist" }{{ /if }}{{ /yield:schema_main_entity }}
        }{{ stack:schema }}
    ]
}
</script>

<div>
    <p class="mb-4 text-sm font-semibold uppercase tracking-wide text-white">{{ heading }}</p>
    <ul class="flex flex-col text-sm">
        {{ if source == 'stations' }}
            {{ collection:stations }}
                <li>
                    <a
                        href="{{ url }}"
                        class="inline-block py-1.5 hover:text-white hover:underline"
                    >
                        Promocje {{ title }}
                    </a>
                </li>
            {{ /collection:stations }}
        {{ else }}
            {{ taxonomy :from="source" }}
                <li>
                    <a
                        href="{{ url }}"
                        class="inline-block py-1.5 hover:text-white hover:underline"
                    >
                        {{ source == 'paliwa' ? 'Promocje na {title}' : title }}
                    </a>
                </li>
            {{ /taxonomy }}
        {{ /if }}
    </ul>
</div>

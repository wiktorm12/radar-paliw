{{ ad_slot placement="mobile_sticky" }}
    {{ if no_results }}
        {{ if environment !== 'production' }}
            <div
                class="fixed inset-x-0 bottom-0 z-40 border-t border-zinc-200 bg-white/95 p-2 shadow-lg backdrop-blur md:hidden"
                data-ad-sticky
            >
                {{ partial:ads/slot position="mobile_sticky" }}
            </div>
            <div
                class="h-20 md:hidden"
                aria-hidden="true"
                data-ad-sticky-spacer
            ></div>
        {{ /if }}
    {{ else }}
        <div
            class="fixed inset-x-0 bottom-0 z-40 border-t border-zinc-200 bg-white/95 p-2 shadow-lg backdrop-blur md:hidden"
            data-ad-sticky
        >
            <button
                type="button"
                class="absolute -top-11 right-2 flex size-11 items-center justify-center rounded-t-lg bg-white text-sm text-zinc-600 shadow"
                aria-label="Zamknij reklamę"
                data-ad-sticky-close
            >
                <span aria-hidden="true">✕</span>
            </button>
            {{ partial:ads/slot position="mobile_sticky" }}
        </div>
        <div
            class="h-20 md:hidden"
            aria-hidden="true"
            data-ad-sticky-spacer
        ></div>
    {{ /if }}
{{ /ad_slot }}

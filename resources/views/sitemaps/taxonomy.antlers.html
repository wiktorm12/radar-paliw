<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
    <url>
        <loc>{{ site:permalink }}/{{ sitemap_taxonomy }}</loc>
    </url>
    {{ taxonomy :from="sitemap_taxonomy" }}
        {{ unless noindex }}
            <url>
                <loc>{{ permalink }}</loc>
            </url>
        {{ /unless }}
    {{ /taxonomy }}
</urlset>

<?xml version="1.0" encoding="UTF-8"?>
<urlset
    xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"
    xmlns:image="http://www.google.com/schemas/sitemap-image/1.1"
>
    {{ collection :from="sitemap_collection" }}
        {{ unless noindex }}
            <url>
                <loc>{{ permalink }}</loc>
                <lastmod>{{ last_modified format="c" }}</lastmod>
                {{ featured_image }}
                    <image:image>
                        <image:loc>{{ permalink }}</image:loc>
                    </image:image>
                {{ /featured_image }}
            </url>
        {{ /unless }}
    {{ /collection }}
</urlset>

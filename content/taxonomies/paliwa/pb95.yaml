    text: Benzyna 95 (Pb95) to najpopularniejsze paliwo do samochodów z silnikiem benzynowym. Liczba 95 oznacza liczbę oktanową, czyli odporność paliwa na niekontrolowane zapłony. Większość aut osobowych z silnikiem benzynowym jest przystosowana właśnie do tej benzyny, ale zawsze warto sprawdzić zalecenie w instrukcji pojazdu.

title: Program CPN
description:
- type: paragraph
  content:
  - type: text
    text: 'Program CPN („Ceny Paliwa Niżej”) to rządowy pakiet obniżający ceny benzyny i oleju napędowego: niższy VAT, niższa akcyza i dzienne ceny maksymalne ogłaszane przez Ministra Energii. W tej kategorii zebraliśmy artykuły wyjaśniające zasady programu, jego edycje, podstawy prawne i skutki dla kierowców.'
- type: paragraph
  content:
  - type: text
    text: 'Aktualne '
  - type: text
    text: ceny maksymalne paliw dziś
    marks:
    - type: link
      attrs:
        href: /program-cpn
  - type: text
    text: ', wykres i statystyki znajdziesz na stronie programu, a prognozę limitu na kolejny dzień na podstronie '
  - type: text
    text: cena maksymalna na jutro
    marks:
    - type: link
      attrs:
        href: /program-cpn/jutro
  - type: text
    text: . Artykuły opierają się na komunikatach Ministerstwa Energii, Dzienniku Ustaw i danych e-petrol.pl, ale wiążące są zawsze oficjalne obwieszczenia.
seo_title: 'Artykuły o CPN: analizy, poradniki i ceny dzienne'
seo_description: 'Artykuły o CPN (Ceny Paliwa Niżej): zasady programu, edycje, kontrole i analizy oraz dzienne ceny maksymalne Pb95, Pb98 i ON dzień po dniu.'
